<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f5f6fa;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      background: #111827;
      color: white;
      padding: 20px;
    }

    .sidebar a {
      color: white;
      text-decoration: none;
    }

    .content {
      margin-left: 260px;
      padding: 20px;
    }

    .topbar {
      background: white;
      padding: 10px 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
<div class="sidebar">
  <h4 class="mb-4">Admin</h4>

  <div class="list-group list-group-flush">
    <a href="#" class="list-group-item list-group-item-action bg-transparent text-white">Dashboard</a>
    <a href="#" class="list-group-item list-group-item-action bg-transparent text-white">Orders</a>
    <a href="#" class="list-group-item list-group-item-action bg-transparent text-white">Products</a>
    <a href="#" class="list-group-item list-group-item-action bg-transparent text-white">Users</a>
  </div>
</div>
<div class="content">
  <div class="topbar d-flex justify-content-between align-items-center">

    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item"><a href="#">Home</a></li>
        <li class="breadcrumb-item active">Dashboard</li>
      </ol>
    </nav>

    <div class="dropdown">
      <button class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown">
        User
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="#">Profile</a></li>
        <li><a class="dropdown-item" href="#">Settings</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="#">Logout</a></li>
      </ul>
    </div>

  </div>

  <div class="alert alert-success">
    Trang dashboard cua khah
  </div>

  <div class="row g-3 mb-4">

    <div class="col-md-3">
      <div class="card text-white bg-primary">
        <div class="card-body">
          <h5>Sales</h5>
          <h3>1,200</h3>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card text-white bg-success">
        <div class="card-body">
          <h5>Orders</h5>
          <h3>320</h3>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card text-white bg-warning">
        <div class="card-body">
          <h5>Users</h5>
          <h3>850</h3>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card text-white bg-danger">
        <div class="card-body">
          <h5>Errors</h5>
          <h3>12</h3>
        </div>
      </div>
    </div>

  </div>

  <div class="card mb-4">
    <div class="card-body">
      <h5 class="mb-3">Orders Table</h5>

      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th>ID</th>
            <th>Customer</th>
            <th>Status</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>01</td>
            <td>Duong</td>
            <td>Completed</td>
            <td>400k</td>
          </tr>
          <tr>
            <td>02</td>
            <td>Tu</td>
            <td>Pending</td>
            <td>10k</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card mb-4">
    <div class="card-body">
      <h5 class="mb-3">Search & Filter</h5>

      <div class="input-group">
        <input type="text" class="form-control" placeholder="Search">
        <button class="btn btn-primary">Search</button>
      </div>
    </div>
  </div>

  <div class="accordion mb-4" id="faq">

    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#q1">
          Test text 
        </button>
      </h2>
      <div id="q1" class="accordion-collapse collapse show" data-bs-parent="#faq">
        <div class="accordion-body">
          Test text 
        </div>
      </div>
    </div>

    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#q2">
          Test text 
        </button>
      </h2>
      <div id="q2" class="accordion-collapse collapse" data-bs-parent="#faq">
        <div class="accordion-body">
          Test text 
        </div>
      </div>
    </div>

  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
